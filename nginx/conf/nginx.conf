
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    upstream backend_cluster {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
    }

    server {
    	listen       8000;
    	server_name  localhost;

    	root   ../cloud-ui/dist;
        index  index.html;

	# Максимальный размер загружаемого файла (по умолчанию в Nginx стоит 1MB)
    	client_max_body_size 1000M;

    	# 1. Запросы к API проксируем на FastAPI (порт 8001)
    	location /api/ {
        	proxy_pass http://backend_cluster/api/;
        
        	# Передача реальных заголовков клиента для безопасности и кук
        	proxy_set_header Host $host;
        	proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;

        	# Увеличение таймаутов для загрузки больших файлов
        	proxy_read_timeout 300s;
        	proxy_connect_timeout 75s;
    	}

    	# 2. Все остальные запросы отдаем фронтенду (React SPA)
    	location / {
        	try_files $uri $uri/ /index.html;
    	}
}

